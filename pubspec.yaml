name: BizNote
description: A production-ready iOS-style offline Notepad app built with Flutter.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  # Local, offline-first persistence.
  sqflite: ^2.3.0
  path: ^1.8.3
  # Timestamp formatting ("23/09/2026 12:20 PM").
  intl: ^0.19.0
  # Bridges the SQLite database to the presentation layer (ChangeNotifier).
  provider: ^6.1.1
  # Foreground/background geolocation + permission handling.
  geolocator: ^14.0.3
  # Persistent foreground service on Android + BGTaskScheduler on iOS.
  flutter_background_service: ^5.1.0
  sqflite_common_ffi: ^2.4.3
  sqflite_common_ffi_web: ^1.2.0
  path_provider: ^2.1.6
  # Firebase: app bootstrap + Realtime Database mirror of every tracker fix.
  firebase_core: ^4.15.0
  firebase_database: ^12.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    # Source artwork used by the empty-state illustration and as the reference
    # for the generated Android/iOS launcher icons.
    - lib/assets/
